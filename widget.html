<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Bot Widget</title>
    <style>
      :root {
        --brand: #5b54e8;
        --brand-2: #7d78f0;
        --ink: #222033;
        --surface: rgba(255, 255, 255, 0.97);
        --dock: rgba(26, 28, 46, 0.58);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "Noto Sans TC", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #stage {
        position: absolute;
        inset: 0;
      }
      .avatar-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /* ===== 底部控制 dock（毛玻璃）===== */
      #control-bar {
        position: absolute;
        left: 50%;
        bottom: 10px;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding: 6px;
        border-radius: 18px;
        background: var(--dock);
        backdrop-filter: blur(10px) saturate(1.3);
        -webkit-backdrop-filter: blur(10px) saturate(1.3);
        box-shadow:
          0 8px 24px rgba(0, 0, 0, 0.22),
          inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      }
      .dock-row {
        display: flex;
        gap: 5px;
        align-items: center;
      }
      #type-input {
        flex: 1;
        min-width: 0;
        appearance: none;
        border: none;
        outline: none;
        background: rgba(255, 255, 255, 0.92);
        color: var(--ink);
        border-radius: 12px;
        height: 36px;
        padding: 0 12px;
        font:
          500 13.5px "Noto Sans TC",
          system-ui,
          sans-serif;
      }
      #type-input::placeholder {
        color: #888da0;
      }
      #type-input:focus {
        background: #fff;
        box-shadow: 0 0 0 2px rgba(91, 84, 232, 0.5);
      }
      .ctrl {
        appearance: none;
        border: none;
        cursor: pointer;
        color: #fff;
        background: rgba(255, 255, 255, 0.14);
        height: 36px;
        min-width: 36px;
        padding: 0 9px;
        border-radius: 12px;
        flex-shrink: 0;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        font-size: 13.5px;
        font-weight: 600;
        line-height: 1;
        transition:
          transform 0.12s,
          background 0.15s,
          filter 0.15s;
      }
      .ctrl:hover {
        background: rgba(255, 255, 255, 0.26);
      }
      .ctrl:active {
        transform: scale(0.93);
      }
      .ctrl:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }
      .ctrl.primary {
        background: linear-gradient(135deg, var(--brand-2), var(--brand));
        padding: 0 13px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
      }
      .ctrl.primary:hover {
        filter: brightness(1.1);
        background: linear-gradient(135deg, var(--brand-2), var(--brand));
      }
      .ctrl.listening {
        background: linear-gradient(135deg, #e74c3c, #c0392b) !important;
        animation: pulse 1.1s infinite;
      }
      .ctrl.llm-on {
        background: linear-gradient(135deg, #f2b34f, #e69426);
      } /* 啟用中＝琥珀，與主色靛藍對比 */
      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.55);
        }
        50% {
          box-shadow: 0 0 0 7px rgba(231, 76, 60, 0);
        }
      }

      /* ===== 對話泡泡（帶尾巴）===== */
      #bubble {
        position: absolute;
        right: 14px;
        top: 14px;
        left: 14px;
        background: var(--surface);
        color: var(--ink);
        border-radius: 16px;
        padding: 11px 14px;
        font-size: 14px;
        line-height: 1.55;
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.18),
          inset 0 0 0 1px rgba(91, 84, 232, 0.1);
        opacity: 0;
        transform: translateY(-8px) scale(0.98);
        transform-origin: top center;
        transition:
          opacity 0.22s,
          transform 0.22s;
        pointer-events: none;
      }
      #bubble::after {
        content: "";
        position: absolute;
        right: 38px;
        bottom: -7px;
        width: 14px;
        height: 14px;
        background: var(--surface);
        transform: rotate(45deg);
      }
      #bubble.show {
        opacity: 1;
        transform: none;
      }

      /* ===== 範例提示清單 ===== */
      #suggestions {
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 104px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
        pointer-events: auto;
      }
      #suggestions .sg-label {
        width: 100%;
        text-align: center;
        font-size: 11px;
        font-weight: 600;
        color: #fff;
        letter-spacing: 0.3px;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
        margin-bottom: 2px;
      }
      .sugg {
        appearance: none;
        cursor: pointer;
        white-space: nowrap;
        background: rgba(255, 255, 255, 0.92);
        color: var(--brand);
        border: 1px solid rgba(91, 84, 232, 0.22);
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        padding: 6px 12px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.16);
        transition:
          transform 0.12s,
          background 0.15s;
      }
      .sugg:hover {
        background: #fff;
        transform: translateY(-1px);
      }
      .sugg:active {
        transform: scale(0.96);
      }
      .sugg:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }

      #direct-warn {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: #f4f6f8;
        color: #556;
        font-size: 15px;
        text-align: center;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="bubble"></div>
      <div id="suggestions"></div>
      <div id="control-bar">
        <div class="dock-row">
          <input
            id="type-input"
            type="text"
            maxlength="200"
            placeholder="打字問我也可以…"
            aria-label="輸入文字問題"
          />
          <button class="ctrl primary" id="btn-send" aria-label="送出文字問題">
            <span aria-hidden="true">➤</span>
          </button>
        </div>
        <div class="dock-row" role="toolbar" aria-label="虛擬人控制列">
          <button class="ctrl primary" id="btn-mic" aria-label="開始語音對話">
            <span aria-hidden="true">🎤</span> 說話
          </button>
          <button
            class="ctrl"
            id="btn-engine"
            aria-label="切換 2D / 3D 角色"
            style="display: none"
          >
            2D／3D
          </button>
          <button
            class="ctrl"
            id="btn-llm"
            aria-label="啟用瀏覽器內 AI 大腦（首次需下載模型）"
            aria-pressed="false"
          >
            <span aria-hidden="true">🧠</span>
          </button>
          <button
            class="ctrl"
            id="btn-mute"
            aria-label="靜音"
            aria-pressed="false"
          >
            <span aria-hidden="true">🔊</span>
          </button>
          <button class="ctrl" id="btn-speed" aria-label="調整語速">
            1.0×
          </button>
          <button class="ctrl" id="btn-close" aria-label="收起助理">
            <span aria-hidden="true">✕</span>
          </button>
        </div>
      </div>
    </div>
    <div id="direct-warn">請透過 <code>embed.js</code> 載入此元件。</div>

    <!-- 3D(VRM) 引擎用的 importmap：宣告在這「不會」下載，等真的 import('three') 才抓 → lazy。
       2D(Live2D) 的 pixi/live2d 改成 bootAvatar() 裡用到才動態載入。 -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
          "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.4/lib/three-vrm.module.min.js",
          "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3.5.4/lib/three-vrm-animation.module.min.js"
        }
      }
    </script>
    <script src="knowledge.js"></script>

    <!-- M4b：WebLLM（瀏覽器內跑小模型，零金鑰）。函式庫改成「按下🧠才動態 import」，
       一般訪客（不啟用大腦）不會下載這包 JS。控制權掛到 window.LLM。 -->
    <script src="widget.main.js"></script>
  </body>
</html>
