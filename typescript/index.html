<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Avatar Bot - TypeScript Demo</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      #app {
        width: 50%;
        height: 60%;
      }
    </style>
  </head>

  <body>
    <div id="app"></div>
    <script type="module">
      import {
        initAvatarBot,
        GENDER_MAP,
        AVATAR_MODE_MAP,
        ENGINE_MODE_MAP,
        FIT_MODE_MAP,
        REASONING_MODE_MAP,
        AI_PROVIDER_STATUS_MAP,
        AI_PROVIDER_PING_STRATEGY_MAP
      } from '@/core';
      import { KNOWLEDGE, COMPANION_KNOWLEDGE } from '@/example/knowledge';

      const app = document.getElementById('app');
      window.aiAvatarWidget = await initAvatarBot({
        container: app,
        // 本地端 WebGPU WebLLM 旗艦模型與兩階段 OOM 降級設定
        // llmModel: 'gemma-2-2b-it-q4f32_1-MLC', // Google 公開模型
        // llmModel: 'DeepSeek-R1-Distill-Qwen-7B-q4f16_1-MLC', // 支援推論模型
        // llmModel: 'Qwen3-8B-q4f16_1-MLC', // 支援推論模型
        llmModel: 'Hermes-3-Llama-3.1-8B-q4f32_1-MLC', // 預設 8B 旗艦模型（支援完整 Function Calling 與推論思考鏈）
        llmFallbackModel: 'Qwen2.5-1.5B-Instruct-q4f16_1-MLC', // 低配備設備（如 8GB 記憶體）自動 OOM 降級保底模型
        enableOomFallback: true, // 啟用 WebGPU 顯存不足自動降級
        // llmMaxTokens: 1024, // WebLLM 端側模型回應最大 Token 數（預設 1024）
        // aiProviderModel: 'deepseek-r1:8b', // 或 8b 等 Ollama 原生推論模型
        // aiProviderModel: 'hermes3:8b', // 遠端伺服器預設旗艦模型 (Ollama / vLLM)
        // aiProviderModel: 'qwen2.5:latest',
        aiProviderModel: 'gemma4:12b',
        aiProviderBaseUrl: 'http://localhost:5173/api/ollama',
        // AI Provider 探活策略與自訂端點（非阻塞背景探活，首頁秒開）
        aiProviderAutoPing: AI_PROVIDER_PING_STRATEGY_MAP.EAGER, // 'eager' (預設非阻塞背景探活) | 'lazy' (延遲首問) | 'manual' (手動探活)
        // aiProviderPingUrl: '/api/tags', // 可選自訂端點路徑（未設定時自動推導 Ollama: /api/tags 或 OpenAI: /models）
        // ⚠️ [實驗性 Experimental] 推論思考過程設定（目前推論輸出各模型穩定度尚在驗證中，可依情境評估使用）
        reasoning: {
          mode: REASONING_MODE_MAP.always, // REASONING_MODE_MAP.auto (自動偵測) | REASONING_MODE_MAP.always (強制注入思考鏈指令) | REASONING_MODE_MAP.never (關閉)
          showThinkingInBubble: true // 思考期間氣泡顯示動態「讓我想想…」
          // promptDirective: '自訂思考提示詞，或設為 false 完全由開發者在 systemContext 自主控制'
        },
        aiProviderIsStream: true,
        knowledge: KNOWLEDGE,
        startMode: ENGINE_MODE_MAP.threeDimensional, // 預設以 3D 模式啟動方便測試 3D VRMA 動作
        fitMode: FIT_MODE_MAP.HALF, // FIT_MODE_MAP.HALF (半身特寫) | FIT_MODE_MAP.FULL (全身)
        // 2D Live2D 縮放與位置客製化 (支援通用設定與 half/full 雙模式專屬設定)
        // skin2d: {
        //   offsetX: 0,
        //   offsetY: 0,
        //   half: { zoom: 1.9, anchor: { x: 0.5, y: 1.0 } },
        //   full: { zoom: 1.0, anchor: { x: 0.5, y: 3.0 } }
        // },
        // 3D VRM 攝影機與模型變換客製化 (支援通用設定與 half/full 雙模式專屬設定)
        // skin3d: {
        //   pointerLook: true,
        //   half: {
        //     camera: { fov: 26, position: { x: 0, y: 1.4, z: 2.5 }, lookAt: { x: 0, y: 1.2, z: 0 } },
        //     model: { scale: { x: 1, y: 1, z: 1 } }
        //   },
        //   full: {
        //     camera: { fov: 30, position: { x: 0, y: 1.0, z: 3.5 }, lookAt: { x: 0, y: 0.9, z: 0 } },
        //     model: { scale: { x: 1, y: 1, z: 1 } }
        //   }
        // },
        companionKnowledge: COMPANION_KNOWLEDGE,
        gender: GENDER_MAP.male,
        // gender: GENDER_MAP.female,
        enableMemory: true, // 預設全面啟用多輪對話記憶（可在這設為 false 關閉）
        // 上下文壓縮與記憶預算控制 (Compression Options)
        // compression: {
        //   strategy: 'sliding-window', // 'sliding-window' | 'rolling-summary' | 'none'
        //   maxTurns: 6,                // 全域預設保留輪數 (1 輪 = 1 問 + 1 答)
        //   maxTotalChars: 4000,        // 全域字元預算上限
        //   webLlm: {                   // 針對前端 WebLLM 端側模型個別覆寫 (節省顯存)
        //     maxTurns: 3,
        //     maxTotalChars: 1500
        //   },
        //   aiProvider: {               // 針對遠端 AI Provider 個別覆寫
        //     maxTurns: 8,
        //     maxTotalChars: 6000
        //   },
        //   // 自訂壓縮器 Hook (可自訂演算法或非同步摘要)
        //   // customCompressor: async ({ messages, systemPrompt, history, latestQuestion, limits }) => {
        //   //   return messages;
        //   // }
        // },
        // avatarMode: AVATAR_MODE_MAP.companion,
        // avatarMode: AVATAR_MODE_MAP.assistant,
        // modes: {
        //   mentor: {
        //     systemPrompt: '你是程式導師，以簡潔、條理清晰的方式指導架構設計。{{RAG}}\n{{styleRule}}',
        //     welcomeText: '嗨！我是程式導師，有任何架構或開發問題隨時問我！',
        //     greeting: '你好！今天想討論什麼技術主題呢？'
        //   }
        // },

        onReady(aiAvatar) {
          console.log('[avatar] widget ready:', aiAvatar);
          console.log(
            '%c[3D 動作與 AI 連線測試指南]',
            'color: #3b82f6; font-weight: bold; font-size: 14px;'
          );
          console.log('可直接在 Console 執行下列指令進行測試：');
          console.log(
            '▶ playGesture("goodbye")    // 動作測試：goodbye.vrma (登場/揮手再見)'
          );
          console.log('▶ playGesture("appearing")  // appearing.vrma');
          console.log('▶ playGesture("liked")      // liked.vrma');
          console.log('▶ playGesture("waiting")    // waiting.vrma');
          console.log(
            '▶ await pingAiProvider()   // 探活/重試遠端 AI Provider 連線 (模式 A)'
          );
          console.log(
            '▶ aiAvatarWidget.isAiProviderReady // 檢查 AI 是否在線就緒'
          );
          console.log(
            '▶ aiAvatarWidget.store.getState().aiProviderStatus // 取得目前狀態 (idle/connecting/connected/error)'
          );
        },
        onSpeaking(text, aiAvatar) {
          console.log('[avatar] speaking:', text);
        },
        onStreamChunk(chunkDelta, rawChunk) {
          console.log('[avatar] stream chunk (TTS active):', chunkDelta);
        },
        onAiProviderConnecting() {
          console.log('[avatar] 🧠 AI Provider 連線探活中 (connecting)...');
        },
        onAiProviderConnected(response, fetchSetting, aiProvider) {
          console.log(
            '[avatar] 🧠✓ AI Provider 連線成功 (connected):',
            aiProvider?.model || ''
          );
        },
        onAiProviderError(error) {
          console.warn('[avatar] 🧠✗ AI Provider 連線失敗 (error):', error);
        },
        onReasoningStart(info) {
          console.log(
            '[avatar] 🧠 [Experimental] reasoning started (silent track):',
            info
          );
        },
        onReasoningChunk(info, chunkDelta, accumulated, rawChunk) {
          console.log(
            '[avatar] 💭 [Experimental] reasoning chunk:',
            chunkDelta
          );
        },
        onReasoningEnd(info, fullReasoning, durationMs) {
          console.log(
            `[avatar] 💡 [Experimental] reasoning finished in ${durationMs}ms`
          );
        },
        onLlmOomFallback(info, primaryModel, fallbackModel, error) {
          console.warn(
            `[avatar] ⚠️ WebGPU OOM detected: Falling back from ${primaryModel} to ${fallbackModel}`,
            error
          );
        },
        onMinimalTrigger(newIsMinimal, aiAvatar) {
          console.log('[avatar] minimal toggled:', newIsMinimal);
        },
        onError(error) {
          console.warn('[avatar] widget error:', error);
        }
      });

      // 訂閱 Store 狀態變更（響應式廣播）
      window.aiAvatarWidget?.store?.subscribe('aiProviderStatus', (status) => {
        console.log(`[avatar] 📡 Store 狀態變更 (aiProviderStatus): ${status}`);
      });

      // 掛載全域便捷函式供開發者工具直接呼叫
      window.playGesture = (gestureName) => {
        if (typeof window.aiAvatarWidget?.playGesture === 'function') {
          window.aiAvatarWidget.playGesture(gestureName);
          console.log(`[playGesture] 播放動作: ${gestureName}`);
        } else {
          console.warn(
            '[playGesture] aiAvatarWidget 尚未就緒或未提供 playGesture'
          );
        }
      };

      window.pingAiProvider = async (fetchSetting) => {
        if (typeof window.aiAvatarWidget?.pingAiProvider === 'function') {
          console.log('[pingAiProvider] 發起連線探活...');
          const ok = await window.aiAvatarWidget.pingAiProvider(fetchSetting);
          console.log(`[pingAiProvider] 探活結果: ${ok ? '成功' : '失敗'}`);
          return ok;
        }
        console.warn('[pingAiProvider] aiAvatarWidget 尚未就緒');
        return false;
      };
    </script>
  </body>
</html>
